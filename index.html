  <script>
    const navbar=document.getElementById('navbar');
    window.addEventListener('scroll',()=>navbar.classList.toggle('scrolled',window.scrollY>25),{passive:true});
    const navToggle=document.getElementById('navToggle'),navLinks=document.getElementById('navLinks');
    navToggle?.addEventListener('click',()=>{const open=navLinks.classList.toggle('open');navToggle.setAttribute('aria-expanded',open?'true':'false')});
    navLinks?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navLinks.classList.remove('open');navToggle.setAttribute('aria-expanded','false')}));

    const revealObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');revealObserver.unobserve(e.target)}}),{threshold:.1});
    document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));

    /* Each slider keeps its own five-item state. */
    document.querySelectorAll('[data-slider]').forEach(slider=>{
      const track=slider.querySelector('.slides'),slides=[...slider.querySelectorAll('.slide')],prev=slider.querySelector('.prev'),next=slider.querySelector('.next'),count=slider.querySelector('.slider-count');let index=0;
      const update=()=>{track.style.transform=`translateX(-${index*100}%)`;if(count)count.textContent=`${String(index+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`};
      prev?.addEventListener('click',e=>{e.stopPropagation();index=(index-1+slides.length)%slides.length;update()});next?.addEventListener('click',e=>{e.stopPropagation();index=(index+1)%slides.length;update()});
      slider.querySelectorAll('img').forEach(img=>img.addEventListener('click',e=>{e.stopPropagation();openLightbox('image',img.currentSrc||img.src)}));
      slider.closest('.project-media')?.querySelector('.media-expand')?.addEventListener('click',e=>{e.stopPropagation();const img=slides[index].querySelector('img');openLightbox('image',img.currentSrc||img.src)});
      update();
    });

    /* Video: preview never plays in-card. Play and fullscreen both use one lightbox instance. */
    document.querySelectorAll('.video-container').forEach(container=>{
      const video=container.querySelector('video'),play=container.querySelector('.video-play'),expand=container.querySelector('.media-expand');
      const source=video.querySelector('source')?.src||video.currentSrc;
      const open=()=>openLightbox('video',source);
      play?.addEventListener('click',e=>{e.stopPropagation();open()});expand?.addEventListener('click',e=>{e.stopPropagation();open()});video.addEventListener('click',open);
    });

    const lightbox=document.getElementById('lightbox'),content=document.getElementById('lightboxContent'),close=document.getElementById('lightboxClose');
    function openLightbox(type,src){
      content.innerHTML='';
      if(type==='image'){const img=document.createElement('img');img.src=src;img.alt='Portfolio artwork';content.appendChild(img)}
      else{const v=document.createElement('video');v.src=src;v.controls=true;v.autoplay=true;v.playsInline=true;v.muted=false;v.setAttribute('controlsList','nodownload');content.appendChild(v);v.play().catch(()=>{});}
      lightbox.classList.add('active');lightbox.setAttribute('aria-hidden','false');document.body.classList.add('lightbox-open');
    }
    function closeLightbox(){const v=content.querySelector('video');if(v)v.pause();content.innerHTML='';lightbox.classList.remove('active');lightbox.setAttribute('aria-hidden','true');document.body.classList.remove('lightbox-open')}
    close.addEventListener('click',closeLightbox);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lightbox.classList.contains('active'))closeLightbox()});
    document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.style.opacity='0'}));
  </script>

    document.querySelectorAll("[data-slider]").forEach((slider) => {
      const track = slider.querySelector(".portfolio-track");
      const slides = Array.from(slider.querySelectorAll(".portfolio-slide"));
      const dots = slider.querySelector(".slider-dots");
      const prev = slider.querySelector(".prev");
      const next = slider.querySelector(".next");
      let index = 0;
      slides.forEach((_, i) => {
        const dot = document.createElement("button");
        dot.className = "slider-dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `Go to slide ${i + 1}`);
        dot.addEventListener("click", () => go(i));
        dots.appendChild(dot);
      });
      const update = () => {
        track.style.transform = `translateX(-${index * 100}%)`;
        dots.querySelectorAll(".slider-dot").forEach((d,i) => d.classList.toggle("active", i === index));
        const meta = slider.parentElement.querySelector(".portfolio-block-meta");
        if (meta) meta.textContent = `${String(index+1).padStart(2,"0")} / 05 — ${meta.textContent.split("—")[1]?.trim() || ""}`;
      };
      const go = (i) => { index = (i + slides.length) % slides.length; update(); };
      prev.addEventListener("click", () => go(index - 1));
      next.addEventListener("click", () => go(index + 1));
      let sx = 0;
      slider.addEventListener("touchstart", e => { sx = e.changedTouches[0].clientX; }, {passive:true});
      slider.addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx; if(Math.abs(dx)>45) go(index + (dx < 0 ? 1 : -1)); }, {passive:true});
      update();
    });

    /* =======================================================

    document.querySelectorAll(".video-container").forEach((container) => {
      const video = container.querySelector("video");
      const playButton = container.querySelector(".video-play");
      const expandButton = container.querySelector(".media-expand");
      if (!video || !playButton) return;
      const source = video.querySelector("source")?.src || video.currentSrc;
      const openVideo = (event) => { event?.preventDefault(); event?.stopPropagation(); openLightbox("video", source, true); };
      playButton.addEventListener("click", openVideo);
      expandButton?.addEventListener("click", openVideo);
      video.addEventListener("click", openVideo);
    });
